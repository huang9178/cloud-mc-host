name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 app.py config.py core/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
    - name: Test import
      run: |
        python -c "import config; print('Config OK')"
        python -c "from core.auth import authenticate; print('Auth OK')"
        python -c "from core.server_manager import MCServer; print('ServerManager OK')"
        python -c "from core.file_manager import FileManager; print('FileManager OK')"
        python -c "from core.backup_manager import BackupManager; print('BackupManager OK')"

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Build zip package
      run: |
        zip -r cloud-mc-host.zip . -x "*.git*" "*/__pycache__/*" "*.pyc" "*/data/*"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloud-mc-host
        path: cloud-mc-host.zip

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: |
        docker build -t cloudmc-host:latest .
        docker images
